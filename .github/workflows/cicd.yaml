name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches: [main]

jobs:

  # =========================
  # CONTINUOUS INTEGRATION
  # =========================
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: medicalbot
          IMAGE_TAG: latest

        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # =========================
  # CONTINUOUS DEPLOYMENT
  # =========================
  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =========================
      # CHECK PINECONE SECRET
      # =========================
      - name: Verify Pinecone Secret
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}

        run: |
          if [ -z "$PINECONE_API_KEY" ]; then
            echo "❌ PINECONE_API_KEY is EMPTY"
            exit 1
          else
            echo "✅ PINECONE_API_KEY is PRESENT"
          fi

      # =========================
      # STOP OLD CONTAINER
      # =========================
      - name: Stop old container
        run: |
          docker stop medicalbot || true
          docker rm medicalbot || true

      # =========================
      # PULL LATEST IMAGE
      # =========================
      - name: Pull latest Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: medicalbot

        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # =========================
      # RUN DOCKER CONTAINER
      # =========================
      - name: Run Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: medicalbot

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |
          docker run -d \
            --name medicalbot \
            --restart unless-stopped \
            -p 8080:8080 \
            -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            -e AWS_DEFAULT_REGION="us-east-1" \
            -e PINECONE_API_KEY="$PINECONE_API_KEY" \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # =========================
      # CHECK CONTAINER
      # =========================
      - name: Check container
        run: |
          sleep 5
          docker ps
          docker logs --tail 50 medicalbot